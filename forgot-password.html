<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>بازیابی رمز عبور | پارس الکتریک</title>

    <link rel="stylesheet" href="css/style.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
</head>

<body>

    <main class="forgot-page">

        <div class="forgot-box">

            <div class="forgot-icon">
                <i class="fa-solid fa-lock"></i>
            </div>

            <h1>بازیابی رمز عبور</h1>

            <p>
                شماره موبایل خود را وارد کنید تا کد تأیید برای شما ارسال شود.
            </p>


            <!-- مرحله اول -->

            <form id="forgotPhoneForm">

                <label for="forgotPhone">
                    شماره موبایل
                </label>

                <input
                    type="tel"
                    id="forgotPhone"
                    placeholder="09123456789"
                    maxlength="11"
                    required
                >

                <button type="submit">
                    <i class="fa-solid fa-message"></i>
                    ارسال کد تأیید
                </button>

            </form>


            <!-- مرحله دوم -->

            <div id="verificationStep" style="display:none;">

                <label for="verificationCode">
                    کد تأیید پیامک
                </label>

                <input
                    type="text"
                    id="verificationCode"
                    placeholder="کد ارسال‌شده"
                    maxlength="6"
                >

                <button
                    type="button"
                    id="verifyCodeButton"
                >
                    تأیید کد
                </button>

            </div>


            <!-- مرحله سوم -->

            <form
                id="newPasswordForm"
                style="display:none;"
            >

                <label for="newPassword">
                    رمز عبور جدید
                </label>

                <input
                    type="password"
                    id="newPassword"
                    placeholder="رمز جدید"
                >


                <label for="confirmPassword">
                    تکرار رمز عبور جدید
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="تکرار رمز جدید"
                >


                <button type="submit">
                    <i class="fa-solid fa-key"></i>
                    ثبت رمز جدید
                </button>

            </form>


            <div
                id="forgotMessage"
                class="forgot-message"
            ></div>


            <a
                href="login.html"
                class="back-login"
            >
                <i class="fa-solid fa-arrow-right"></i>
                بازگشت به صفحه ورود
            </a>

        </div>

    </main>


    <script src="js/forgot-password.js"></script>

</body>

</html>
