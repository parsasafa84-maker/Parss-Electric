<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>سفارش‌های من | پارس الکتریک</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

</head>


<body>

    <!-- ==============================
         هدر
    ============================== -->

    <header class="site-header">

        <div class="header-container">

            <a
                href="index.html"
                class="logo"
            >
                <i class="fa-solid fa-bolt"></i>

                <div>
                    <strong>پارس الکتریک</strong>
                    <small>فروشگاه تخصصی برق</small>
                </div>
            </a>


            <div class="header-actions">

                <a
                    href="index.html"
                    class="header-action"
                >
                    <i class="fa-solid fa-house"></i>
                    <span>خانه</span>
                </a>

                <a
                    href="cart.html"
                    class="header-action"
                >
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span>سبد خرید</span>
                </a>

            </div>

        </div>

    </header>


    <!-- ==============================
         محتوای سفارش‌ها
    ============================== -->

    <main class="orders-page">

        <div class="orders-container">

            <div class="orders-page-title">

                <div>

                    <h1>
                        <i class="fa-solid fa-box"></i>
                        سفارش‌های من
                    </h1>

                    <p>
                        مشاهده سفارش‌های قبلی و وضعیت سفارش‌های شما
                    </p>

                </div>

                <a
                    href="profile.html"
                    class="back-profile"
                >
                    <i class="fa-solid fa-user"></i>
                    پنل کاربری
                </a>

            </div>


            <!-- لیست سفارش‌ها -->

            <div
                id="ordersList"
                class="orders-list"
            >

                <div class="orders-loading">
                    در حال بارگذاری سفارش‌ها...
                </div>

            </div>

        </div>

    </main>


    <script src="js/orders.js"></script>

</body>

</html>
