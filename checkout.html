<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تکمیل سفارش | پارس الکتریک</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">

    <style>
        .checkout-page {
            padding: 35px 0 60px;
        }

        .checkout-title {
            margin-bottom: 25px;
        }

        .checkout-title h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .checkout-title p {
            color: #777;
        }

        .checkout-layout {
            display: grid;
            grid-template-columns: 1fr 360px;
            gap: 25px;
            align-items: start;
        }

        .checkout-box {
            background: #fff;
            border-radius: 14px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }

        .checkout-box h2 {
            font-size: 19px;
            margin-bottom: 22px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-group label {
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #ddd;
            border-radius: 9px;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #ffc107;
            box-shadow: 0 0 0 3px rgba(255,193,7,0.12);
        }

        .shipping-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .shipping-option {
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
        }

        .shipping-option:hover {
            border-color: #ffc107;
        }

        .shipping-option input {
            accent-color: #ffc107;
        }

        .shipping-info {
            flex: 1;
        }

        .shipping-info strong {
            display: block;
            margin-bottom: 4px;
        }

        .shipping-info span {
            color: #777;
            font-size: 13px;
        }

        .checkout-summary {
            background: #fff;
            border-radius: 14px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            position: sticky;
            top: 20px;
        }

        .checkout-summary h2 {
            font-size: 19px;
            margin-bottom: 20px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }

        .summary-row.total {
            border-bottom: none;
            font-size: 18px;
            font-weight: bold;
            margin-top: 8px;
        }

        .summary-total {
            color: #d99b00;
        }

        .continue-payment {
            width: 100%;
            border: none;
            background: #ffc107;
            color: #111;
            padding: 15px;
            border-radius: 10px;
            font-family: inherit;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.2s;
        }

        .continue-payment:hover {
            background: #e0a800;
        }

        .coupon-box {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .coupon-box input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: inherit;
        }

        .coupon-box button {
            border: none;
            background: #101828;
            color: #fff;
            padding: 0 18px;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
        }

        .empty-checkout {
            text-align: center;
            padding: 60px 20px;
            background: #fff;
            border-radius: 14px;
        }

        @media (max-width: 900px) {
            .checkout-layout {
                grid-template-columns: 1fr;
            }

            .checkout-summary {
                position: static;
            }
        }

        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            .checkout-box,
            .checkout-summary {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

<header class="main-header">
    <div class="container header-content">

        <a href="index.html" class="logo">
            <i class="fas fa-bolt"></i>
            پارس الکتریک
        </a>

        <div class="header-actions">
            <a href="cart.html" class="header-action">
                <i class="fas fa-shopping-cart"></i>
                سبد خرید
            </a>

            <button id="themeToggle" class="theme-toggle">
                <i class="fas fa-moon"></i>
            </button>
        </div>

    </div>
</header>


<main class="checkout-page">

    <div class="container">

        <div class="checkout-title">
            <h1>تکمیل سفارش</h1>
            <p>اطلاعات ارسال سفارش خود را وارد کنید.</p>
        </div>


        <div id="checkoutContent">

            <div class="checkout-layout">

                <div>

                    <!-- اطلاعات مشتری -->
                    <div class="checkout-box">

                        <h2>
                            <i class="fas fa-user"></i>
                            اطلاعات گیرنده
                        </h2>

                        <div class="form-grid">

                            <div class="form-group">
                                <label for="firstName">نام</label>
                                <input
                                    type="text"
                                    id="firstName"
                                    placeholder="نام خود را وارد کنید">
                            </div>

                            <div class="form-group">
                                <label for="lastName">نام خانوادگی</label>
                                <input
                                    type="text"
                                    id="lastName"
                                    placeholder="نام خانوادگی">
                            </div>

                            <div class="form-group">
                                <label for="phone">شماره موبایل</label>
                                <input
                                    type="tel"
                                    id="phone"
                                    placeholder="09123456789">
                            </div>

                            <div class="form-group">
                                <label for="postalCode">کد پستی</label>
                                <input
                                    type="text"
                                    id="postalCode"
                                    placeholder="کد پستی ۱۰ رقمی">
                            </div>

                        </div>

                    </div>


                    <!-- آدرس -->
                    <div class="checkout-box">

                        <h2>
                            <i class="fas fa-location-dot"></i>
                            آدرس ارسال
                        </h2>

                        <div class="form-grid">

                            <div class="form-group">
                                <label for="province">استان</label>

                                <select id="province">
                                    <option value="">انتخاب استان</option>
                                    <option>تهران</option>
                                    <option>البرز</option>
                                    <option>اصفهان</option>
                                    <option>فارس</option>
                                    <option>خراسان رضوی</option>
                                    <option>آذربایجان شرقی</option>
                                    <option>گیلان</option>
                                    <option>مازندران</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label for="city">شهر</label>

                                <input
                                    type="text"
                                    id="city"
                                    placeholder="مثلاً تهران">
                            </div>

                            <div class="form-group full">
                                <label for="address">آدرس کامل</label>

                                <textarea
                                    id="address"
                                    placeholder="خیابان، کوچه، پلاک، واحد و..."></textarea>
                            </div>

                        </div>

                    </div>


                    <!-- روش ارسال -->
                    <div class="checkout-box">

                        <h2>
                            <i class="fas fa-truck"></i>
                            روش ارسال
                        </h2>

                        <div class="shipping-options">

                            <label class="shipping-option">

                                <input
                                    type="radio"
                                    name="shipping"
                                    value="post"
                                    data-price="0"
                                    checked>

                                <div class="shipping-info">
                                    <strong>پست پیشتاز</strong>
                                    <span>ارسال معمولی، تحویل حدود ۲ تا ۴ روز کاری</span>
                                </div>

                                <strong>رایگان</strong>

                            </label>


                            <label class="shipping-option">

                                <input
                                    type="radio"
                                    name="shipping"
                                    value="express"
                                    data-price="80000">

                                <div class="shipping-info">
                                    <strong>ارسال سریع</strong>
                                    <span>تحویل سریع‌تر در محدوده‌های قابل پوشش</span>
                                </div>

                                <strong>۸۰,۰۰۰ تومان</strong>

                            </label>

                        </div>

                    </div>

                </div>


                <!-- خلاصه سفارش -->
                <aside class="checkout-summary">

                    <h2>خلاصه سفارش</h2>

                    <div class="summary-row">
                        <span>تعداد کالا</span>
                        <strong id="checkoutCount">۰</strong>
                    </div>

                    <div class="summary-row">
                        <span>مبلغ کالاها</span>
                        <strong id="checkoutSubtotal">۰ تومان</strong>
                    </div>

                    <div class="summary-row">
                        <span>تخفیف</span>
                        <strong id="checkoutDiscount">۰ تومان</strong>
                    </div>

                    <div class="summary-row">
                        <span>هزینه ارسال</span>
                        <strong id="checkoutShipping">رایگان</strong>
                    </div>


                    <!-- کد تخفیف -->
                    <div class="coupon-box">

                        <input
                            type="text"
                            id="couponCode"
                            placeholder="کد تخفیف">

                        <button id="applyCoupon">
                            اعمال
                        </button>

                    </div>


                    <div class="summary-row total">

                        <span>مبلغ نهایی</span>

                        <strong
                            id="checkoutTotal"
                            class="summary-total">
                            ۰ تومان
                        </strong>

                    </div>


                    <button
                        id="continuePayment"
                        class="continue-payment">

                        ادامه و پرداخت
                        <i class="fas fa-arrow-left"></i>

                    </button>

                </aside>

            </div>

        </div>

    </div>

</main>


<script src="js/products.js"></script>
<script src="js/checkout.js"></script>

</body>
</html>
