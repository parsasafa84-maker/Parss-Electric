<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تغییر رمز عبور | پارس الکتریک</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<main class="change-password-page">

    <div class="change-password-box">

        <div class="change-password-icon">
            <i class="fa-solid fa-shield-halved"></i>
        </div>

        <h1>تغییر رمز عبور</h1>

        <p>
            برای تغییر رمز عبور، اطلاعات زیر را وارد کنید.
        </p>

        <form id="changePasswordForm">

            <div class="password-field">
                <label for="currentPassword">
                    رمز عبور فعلی
                </label>

                <input
                    type="password"
                    id="currentPassword"
                    placeholder="رمز عبور فعلی"
                    required
                >
            </div>

            <div class="password-field">
                <label for="newPassword">
                    رمز عبور جدید
                </label>

                <input
                    type="password"
                    id="newPassword"
                    placeholder="رمز عبور جدید"
                    required
                >
            </div>

            <div class="password-field">
                <label for="confirmPassword">
                    تکرار رمز عبور جدید
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="تکرار رمز عبور جدید"
                    required
                >
            </div>

            <button type="submit" class="change-password-btn">
                <i class="fa-solid fa-key"></i>
                تغییر رمز عبور
            </button>

        </form>

        <div id="changePasswordMessage"
             class="change-password-message">
        </div>

        <a href="profile.html" class="back-profile">
            <i class="fa-solid fa-arrow-right"></i>
            بازگشت به پنل کاربری
        </a>

    </div>

</main>

<script src="js/change-password.js"></script>

</body>
</html>
